# Acrescenta somente o conector de saída; nunca publica uma porta do PC.
services:
  # Pela fila pública todas as pessoas chegam pelo conector: o teto por origem não pode ser o de uma pessoa só.
  aplicacao:
    environment:
      LIMITE_ENTRADAS_ORIGEM: '1200'
  conector:
    build: ./conector
    environment:
      ENEM_INTERMEDIARIO: https://enem-ginga-conexao.sabrinaconradoadv.chatgpt.site
      ORIGEM: ${ORIGEM:-http://localhost:8088}
    volumes:
      - ./.segredos/conector:/run/secrets/chave:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 96m
    cpus: 0.25
    networks: [interna, externa]
    depends_on:
      aplicacao:
        condition: service_healthy
    restart: unless-stopped
